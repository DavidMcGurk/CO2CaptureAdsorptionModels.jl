# Reference values for docs/specs/haghpanah2013.md, validation targets V1 to V9.
#
# Generated by build_reference_draft.py. Printed values are taken from the spec's rows
# and converted to SI. Digitised values come from digitise_haghpanah2013.py, which reads
# the figure images embedded in the PDF and marks every reading on an overlay of the figure.
#
# Notes:
#   1. Every tolerance covers only how exactly the value is known from the paper: rounding
#      for printed values, reading error for digitised ones. None allows for a model
#      whose discretisation and time integration differ from the source (deviations
#      D003, D004).
#   2. 26 of the 38 V2 entries come from the close-ups in Figure 4b and 4c, where the
#      N = 2000 curve is read from a bundle of curves. The 15 V9 entries are the UDS curve
#      (N = 200) of the same panels, the paper's result for the scheme of deviation D003.
#   3. The 14 V7 purity and recovery entries are lower bounds, marked bound = "lower"
#      (README.md): the result must be at least value - atol.
#   4. V3 and V4 are printed as approximate and without the level that defines the front;
#      the v2-tau-y entries give the same fronts at fixed levels.
#   5. All targets except V1 depend on the heat of adsorption (M1). V8 also needs M5 to M7.
#   6. 11 points of the pressurisation curves in Figure 8 are hidden behind other curves
#      and have no entry. The UDS curve has no entry where the other curves cover it.
#   7. V2 and V9 times are the figure's dimensionless time (unit 1); V3 and V4 are in
#      seconds. The two are numerically equal for this case (spec A3).

