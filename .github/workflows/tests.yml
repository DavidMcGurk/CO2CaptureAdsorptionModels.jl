name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # julia-actions/cache deletes the caches it supersedes

jobs:
  julia:
    name: Julia fast and validation tiers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Julia version the committed Manifest.toml was resolved with.
      - name: Read Julia version from Manifest.toml
        id: julia-version
        run: |
          version=$(sed -n 's/^julia_version = "\(.*\)"$/\1/p' Manifest.toml)
          test -n "$version" || { echo "::error file=Manifest.toml::no julia_version line"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ steps.julia-version.outputs.version }}

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Instantiate and precompile the workspace
        id: instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(; workspace=true); Pkg.precompile(; workspace=true)'

      - name: Fast tests
        if: ${{ !cancelled() && steps.instantiate.outcome == 'success' }}
        run: julia --project -e 'using Pkg; Pkg.test()'

      - name: Validation tests
        if: ${{ !cancelled() && steps.instantiate.outcome == 'success' }}
        run: julia --project -e 'using Pkg; Pkg.test(; test_args=["validation"])'

  stop-hook:
    name: Stop-hook scenario tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scenario tests
        run: bash .claude/hooks/test-fast-checks.sh
